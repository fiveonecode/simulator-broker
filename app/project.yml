name: SimulatorBrokerApp
options:
  minimumXcodeGenVersion: 2.45.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
targets:
  SimulatorBrokerApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Generated/SimulatorBrokerApp-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.codex.simulator-broker-app
        PRODUCT_NAME: SimulatorBrokerApp
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: debugging
          STRIP_SWIFT_SYMBOLS: "NO"
  SimulatorBrokerAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
        excludes:
          - Fixtures/**
    dependencies:
      - target: SimulatorBrokerApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.codex.simulator-broker-app.tests
schemes:
  SimulatorBrokerApp:
    build:
      targets:
        SimulatorBrokerApp: all
    test:
      targets:
        - name: SimulatorBrokerAppTests
      environmentVariables:
        SIMBROKER_HOST_CONFIG: "$(SIMBROKER_TEST_HOST_CONFIG)"
        SIMBROKER_STATE_ROOT: "$(SIMBROKER_TEST_STATE_ROOT)"
